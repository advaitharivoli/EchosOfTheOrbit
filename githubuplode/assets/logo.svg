<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141f38" />
      <stop offset="65%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>

    <!-- Glowing Electric Ring Gradient -->
    <linearGradient id="orbitRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="40%" stop-color="#0077ff" />
      <stop offset="80%" stop-color="#ff5733" />
      <stop offset="100%" stop-color="#ffb700" />
    </linearGradient>

    <!-- Intense Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Patch Circle -->
  <circle cx="300" cy="300" r="280" fill="url(#bgGrad)" stroke="url(#orbitRing)" stroke-width="8" filter="url(#glow)" />
  <circle cx="300" cy="300" r="268" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2" stroke-dasharray="10,6" />

  <!-- Background Stars -->
  <g fill="#ffffff">
    <circle cx="160" cy="180" r="2" opacity="0.8" />
    <circle cx="440" cy="190" r="2" opacity="0.8" />
    <circle cx="190" cy="340" r="1.5" opacity="0.6" />
    <circle cx="420" cy="350" r="2" opacity="0.7" />
    <circle cx="300" cy="140" r="2.5" opacity="0.9" />
    <circle cx="140" cy="280" r="1.5" opacity="0.5" />
    <circle cx="460" cy="270" r="1.5" opacity="0.5" />
  </g>

  <!-- Glowing Orbit Ellipses -->
  <ellipse cx="300" cy="285" rx="225" ry="75" fill="none" stroke="url(#orbitRing)" stroke-width="5" transform="rotate(-22 300 285)" filter="url(#glow)" />
  <ellipse cx="300" cy="285" rx="225" ry="75" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="16,12" transform="rotate(-22 300 285)" opacity="0.7" />

  <!-- Orbiting Satellite Node -->
  <circle cx="465" cy="205" r="9" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="465" cy="205" r="4.5" fill="#ffffff" />

  <!-- Radio Transmission Waves (Echoes) -->
  <g stroke="#ffb700" fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M 270 200 A 30 30 0 0 1 330 200" stroke-width="4" opacity="0.95" />
    <path d="M 250 175 A 55 55 0 0 1 350 175" stroke-width="3.5" opacity="0.8" />
    <path d="M 230 150 A 80 80 0 0 1 370 150" stroke-width="3" opacity="0.65" />
  </g>

  <!-- Rover / Antenna Silhouette in center -->
  <g fill="#ffffff">
    <!-- Antenna Tip -->
    <circle cx="300" cy="225" r="6" fill="#00f0ff" filter="url(#glow)" />
    <!-- Mast -->
    <rect x="297" y="225" width="6" height="85" rx="3" fill="#ffffff" />
    <!-- Parabolic Dish -->
    <path d="M 275 240 Q 300 260 325 240" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" />
    <!-- Rover Deck -->
    <polygon points="265,310 335,310 355,335 245,335" fill="#1b2844" stroke="#00f0ff" stroke-width="3" />
    <!-- Solar Panels -->
    <rect x="205" y="315" width="45" height="16" rx="3" fill="#0d1b2a" stroke="#ffb700" stroke-width="2" />
    <rect x="350" y="315" width="45" height="16" rx="3" fill="#0d1b2a" stroke="#ffb700" stroke-width="2" />
    <!-- Wheels -->
    <circle cx="240" cy="350" r="12" fill="#080c16" stroke="#ff5733" stroke-width="3.5" />
    <circle cx="280" cy="353" r="11" fill="#080c16" stroke="#ff5733" stroke-width="3" />
    <circle cx="320" cy="353" r="11" fill="#080c16" stroke="#ff5733" stroke-width="3" />
    <circle cx="360" cy="350" r="12" fill="#080c16" stroke="#ff5733" stroke-width="3.5" />
  </g>

  <!-- Bold, Highly Legible Center-Bottom Banner -->
  <rect x="80" y="390" width="440" height="75" rx="14" fill="rgba(8, 14, 28, 0.96)" stroke="url(#orbitRing)" stroke-width="3" filter="url(#glow)" />
  
  <text x="300" y="432" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    ECHOES OF THE ORBIT
  </text>
  <text x="300" y="455" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="14" font-weight="800" fill="#00f0ff" text-anchor="middle" letter-spacing="4">
    NASA SPACE APPS 2026
  </text>
</svg>
